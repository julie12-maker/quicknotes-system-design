<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Manage your notes using an API.</p>
    </header>

    <main>
        <section>
            <h2>Load Notes</h2>
            <button id="load-btn" type="button">Load notes</button>
            <p id="status" role="status" aria-live="polite">Click "Load notes" to get notes from the server.</p>
            <ul id="notes-list"></ul>
        </section>

        <section>
            <h2>Create a Note</h2>
            <form id="note-form">
                <div>
                    <label for="title-input">Note title:</label>
                    <input type="text" id="title-input" name="title" required>
                </div>

                <div>
                    <label for="body-input">Note body (optional):</label>
                    <textarea id="body-input" name="body" rows="4"></textarea>
                </div>

                <button id="submit-btn" type="submit">Create note</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>
</body>
</html>
